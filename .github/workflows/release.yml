# Release: Tag „v*“ → Tests (Windows + Linux) → Windows-Build (Installer, portable EXE, ZIP) → GitHub-Release.
# Alternativ manuell starten (Actions → Release → „Run workflow“ auf main): Der Tag wird dann beim Anlegen des
# Releases auf genau dem getesteten Commit erzeugt; ein bereits vorhandener Tag muss auf diesen Commit zeigen.
# Builds sind unsigniert, solange keine Zertifikats-Secrets (CSC_LINK / CSC_KEY_PASSWORD) hinterlegt sind.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (z. B. v1.0.0-beta.1) – wird auf dem gewählten Branch-Stand angelegt, falls nicht vorhanden'
        required: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows-Build
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Gebaut wird immer der Commit, den auch der Test-Job geprüft hat (github.sha).
      - name: Tag prüfen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Ungültiger Tag: $env:TAG" }
          $sha = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:TAG" --jq .sha 2>$null
          if ($LASTEXITCODE -eq 0 -and "$sha" -match '^[0-9a-f]{40}$') {
            if ($sha -ne $env:GITHUB_SHA) { throw "Tag $env:TAG zeigt auf $sha, getestet wurde $env:GITHUB_SHA" }
            "TAG_EXISTS=true" >> $env:GITHUB_ENV
          } else {
            if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { throw "Tag $env:TAG nicht gefunden" }
            "TAG_EXISTS=false" >> $env:GITHUB_ENV
            "Tag $env:TAG wird beim Anlegen des Releases auf $env:GITHUB_SHA erzeugt."
          }
          $global:LASTEXITCODE = 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Version prüfen
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG passt nicht zur package.json-Version $v" }
          "VERSION=$v" >> $env:GITHUB_ENV
      - run: npm ci
      - name: LGPL-FFmpeg laden
        run: node scripts/fetch-ffmpeg-lgpl.mjs win32-x64
      - name: Build
        run: npm run build
      - name: Windows-Pakete erzeugen (NSIS, portable, ZIP)
        run: npx electron-builder --win nsis portable zip --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Prüfsummen
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding utf8 release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
          Copy-Item vendor/ffmpeg/win32-x64/MANIFEST.json release/ffmpeg-MANIFEST.json
      - name: Update-Dateien prüfen
        # latest.yml ist die Grundlage der App-Updates; sie muss auf den hochgeladenen Installer zeigen
        shell: bash
        run: |
          set -euo pipefail
          setup="PhotoPack-Manager-${VERSION}-Setup.exe"
          test -f release/latest.yml || { echo "release/latest.yml fehlt"; exit 1; }
          test -f "release/${setup}.blockmap" || { echo "Blockmap fehlt"; exit 1; }
          cat release/latest.yml
          grep -Eq "^version: ['\"]?${VERSION//./\\.}['\"]?$" release/latest.yml || { echo "Version in latest.yml passt nicht"; exit 1; }
          grep -Eq "^path: ['\"]?${setup//./\\.}['\"]?$" release/latest.yml || { echo "latest.yml zeigt nicht auf ${setup}"; exit 1; }
      - name: Artefakte sichern
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: photopack-manager-${{ env.VERSION }}-windows
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/ffmpeg-MANIFEST.json
            release/latest.yml
            release/*.blockmap
          retention-days: 30
      - name: GitHub-Release anlegen
        # bash statt PowerShell: Argument-Arrays werden unverändert an gh übergeben
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/${TAG}.md"
          [ -f "$notes" ] || notes="CHANGELOG.md"
          args=(release create "$TAG")
          shopt -s nullglob
          for f in release/*.exe release/*.zip release/*.blockmap release/latest.yml release/SHA256SUMS.txt release/ffmpeg-MANIFEST.json; do args+=("$f"); done
          args+=(--title "PhotoPack Manager ${VERSION}" --notes-file "$notes")
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          if [ "${TAG_EXISTS:-false}" = "true" ]; then args+=(--verify-tag); else args+=(--target "$GITHUB_SHA"); fi
          printf '%q ' gh "${args[@]}"; echo
          gh "${args[@]}"
