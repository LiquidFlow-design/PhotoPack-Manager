# Release: Tag „v*“ → Tests (Windows + Linux) → Windows-Build (Installer, portable EXE, ZIP) → GitHub-Release.
# Builds sind unsigniert, solange keine Zertifikats-Secrets (CSC_LINK / CSC_KEY_PASSWORD) hinterlegt sind.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehender Tag (z. B. v1.0.0-beta.1)'
        required: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows-Build
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Version prüfen
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG passt nicht zur package.json-Version $v" }
          "VERSION=$v" >> $env:GITHUB_ENV
      - run: npm ci
      - name: LGPL-FFmpeg laden
        run: node scripts/fetch-ffmpeg-lgpl.mjs win32-x64
      - name: Build
        run: npm run build
      - name: Windows-Pakete erzeugen (NSIS, portable, ZIP)
        run: npx electron-builder --win nsis portable zip --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Prüfsummen
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding utf8 release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
          Copy-Item vendor/ffmpeg/win32-x64/MANIFEST.json release/ffmpeg-MANIFEST.json
      - name: Artefakte sichern
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: photopack-manager-${{ env.VERSION }}-windows
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/ffmpeg-MANIFEST.json
          retention-days: 30
      - name: GitHub-Release anlegen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/release-notes/$env:TAG.md"
          if (-not (Test-Path $notes)) { $notes = "CHANGELOG.md" }
          $pre = if ($env:VERSION -match '-') { '--prerelease' } else { '' }
          $assets = (Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' -or $_.Name -in 'SHA256SUMS.txt', 'ffmpeg-MANIFEST.json' }).FullName
          gh release create $env:TAG $assets --title "PhotoPack Manager $env:VERSION" --notes-file $notes $pre --verify-tag
